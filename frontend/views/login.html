<h2>Login</h2>

<div>

    <label>Username</label>
    <br>

    <input
        type="text"
        ng-model="loginData.username"
    >

</div>

<br>

<div>

    <label>Password</label>
    <br>

    <input
        type="password"
        ng-model="loginData.password"
    >

</div>

<br>

<button
    ng-click="login()"
    ng-disabled="isLoading"
>
    {{ isLoading ? "Logging in..." : "Login" }}
</button>

<br><br>

<p ng-if="error">
    {{error}}
</p>
